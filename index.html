<style>
:root{--bg:#F3EDE4;--card:#FBF7F1;--ink:#4A3F3A;--sub:#8B7F76;--line:#E2D8CA;--sage:#6F8062;--sage-t:#E3E8DA;--rose:#C9908F;--rose-t:#F2DEDC;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2522;--card:#352F2B;--ink:#EFE6DA;--sub:#A99D92;--line:#4A423C;--sage:#A3B592;--sage-t:#3C4436;--rose:#D9A3A1;--rose-t:#4A3535;--on:#2A2522}}
:root[data-theme="dark"]{--bg:#2A2522;--card:#352F2B;--ink:#EFE6DA;--sub:#A99D92;--line:#4A423C;--sage:#A3B592;--sage-t:#3C4436;--rose:#D9A3A1;--rose-t:#4A3535;--on:#2A2522}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:48px;height:48px;border-radius:12px}
h1{font-family:"Shippori Mincho",serif;font-size:22px;margin:0;flex:1;letter-spacing:.04em}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--sage);border-color:var(--sage);color:var(--on);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 2px 10px}
.bar select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:8px}
.name{font-family:"Shippori Mincho",serif;font-weight:700;font-size:17px;flex:1;word-break:break-all}
.star{background:none;border:0;font-size:22px;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:var(--rose)}
.cat{display:inline-block;font-size:12px;background:var(--rose-t);color:var(--ink);border-radius:999px;padding:1px 10px;margin:2px 0 6px}
.body{white-space:pre-wrap;word-break:break-all;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.body.open{-webkit-line-clamp:unset;display:block}
.act{display:flex;align-items:center;gap:8px;margin-top:10px}
.meta{font-size:12px;color:var(--sub);flex:1}
.copy{background:var(--sage);color:var(--on);border:0;border-radius:999px;padding:9px 22px;font-weight:700;cursor:pointer}
.copy:active{transform:scale(.96)}
.empty{text-align:center;color:var(--sub);padding:48px 12px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:60px;height:60px;border-radius:50%;border:0;background:var(--rose);color:var(--on);font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
dialog{border:0;border-radius:26px;background:var(--bg);color:var(--ink);width:min(92vw,520px);padding:20px;max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(40,30,25,.45)}
dialog h2{font-family:"Shippori Mincho",serif;font-size:19px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px}
textarea.f{min-height:170px;resize:vertical}
.cnt{text-align:right;font-size:12px;color:var(--sub)}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 20px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.p{background:var(--sage);color:var(--on);border-color:var(--sage);font-weight:700}
.btn.d{color:var(--rose);margin-right:auto}
.note{font-size:12.5px;color:var(--sub)}
.crow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const KEY="teikeibun-note-v1";
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{cats:["DM","告知"],items:[]}}
let S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
let cur="all",editId=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1600)}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.focus();a.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();return ok}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function chips(){
  const all=[["all","すべて"],["fav","★お気に入り"],...S.cats.map(c=>["c:"+c,c])];
  if(!all.some(a=>a[0]===cur))cur="all";
  $("chips").innerHTML=all.map(a=>`<button class="chip${a[0]===cur?" on":""}" data-k="${esc(a[0])}">${esc(a[1])}</button>`).join("")}
function render(){
  chips();
  const q=$("q").value.trim().toLowerCase();
  let L=S.items.filter(i=>cur==="all"||(cur==="fav"?i.fav:"c:"+i.cat===cur)).filter(i=>!q||(i.name+i.body).toLowerCase().includes(q));
  if($("sort").value==="used")L.sort((a,b)=>(b.used||0)-(a.used||0)||b.t-a.t);else L.sort((a,b)=>b.t-a.t);
  $("count").textContent=L.length+"件";
  $("list").innerHTML=L.length?L.map(i=>`<div class="item" data-id="${i.id}"><div class="top"><div class="name">${esc(i.name||"(無題)")}</div><button class="star${i.fav?" on":""}" data-a="fav" aria-label="お気に入り">${i.fav?"★":"☆"}</button></div>${i.cat?`<span class="cat">${esc(i.cat)}</span>`:""}<div class="body" data-a="open">${esc(i.body)}</div><div class="act"><span class="meta">${[...i.body].length}文字・${i.used||0}回コピー</span><button class="btn" data-a="edit">編集</button><button class="copy" data-a="copy">コピー</button></div></div>`).join(""):`<div class="empty">${S.items.length?"該当する定型文がありません":"定型文がまだありません。右下の＋から追加できます。"}</div>`}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cur=b.dataset.k;render()}};
$("q").oninput=render;$("sort").onchange=render;
$("list").onclick=async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const it=S.items.find(i=>i.id===e.target.closest(".item").dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==="fav"){it.fav=!it.fav;save();render()}
  else if(a==="open"){b.classList.toggle("open")}
  else if(a==="edit")openEdit(it);
  else if(a==="copy"){if(await copyText(it.body)){it.used=(it.used||0)+1;save();toast("コピーしました");render()}else toast("コピーできませんでした。長押しでコピーしてください")}};
function fillCats(sel){$("eCat").innerHTML=S.cats.map(c=>`<option>${esc(c)}</option>`).join("");if(sel)$("eCat").value=sel}
function openEdit(it){
  editId=it?it.id:null;$("eTitle").textContent=it?"定型文を編集":"定型文を追加";
  $("eName").value=it?it.name:"";$("eBody").value=it?it.body:"";
  fillCats(it?it.cat:(cur.startsWith("c:")?cur.slice(2):S.cats[0]));
  $("eDel").style.display=it?"":"none";cnt();$("dEdit").showModal()}
function cnt(){$("eCnt").textContent=[...$("eBody").value].length+"文字"}
$("eBody").oninput=cnt;
$("add").onclick=()=>openEdit(null);
$("eCancel").onclick=()=>$("dEdit").close();
$("eSave").onclick=()=>{
  const name=$("eName").value.trim(),body=$("eBody").value;
  if(!body.trim()){toast("本文を入力してください");return}
  if(editId){const it=S.items.find(i=>i.id===editId);Object.assign(it,{name,body,cat:$("eCat").value})}
  else S.items.push({id:uid(),name,body,cat:$("eCat").value,fav:false,used:0,t:Date.now()});
  save();$("dEdit").close();render();toast("保存しました")};
$("eDel").onclick=()=>{if(confirm("この定型文を削除しますか?")){S.items=S.items.filter(i=>i.id!==editId);save();$("dEdit").close();render();toast("削除しました")}};
function catList(){$("cList").innerHTML=S.cats.map(c=>`<div class="crow"><span>${esc(c)}</span><button class="btn" data-c="${esc(c)}">削除</button></div>`).join("")}
$("bCats").onclick=()=>{catList();$("dCats").showModal()};
$("cClose").onclick=()=>$("dCats").close();
$("cAdd").onclick=()=>{const v=$("cNew").value.trim();if(!v)return;if(S.cats.includes(v)){toast("同じ名前のカテゴリがあります");return}S.cats.push(v);$("cNew").value="";save();catList();render()};
$("cList").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;const c=b.dataset.c;
  if(confirm("「"+c+"」を削除しますか?中の定型文は残り、カテゴリなしになります。")){S.cats=S.cats.filter(x=>x!==c);S.items.forEach(i=>{if(i.cat===c)i.cat=""});save();catList();render()}};
$("bBackup").onclick=()=>{$("bText").value="";$("dBackup").showModal()};
$("bClose").onclick=()=>$("dBackup").close();
$("bExp").onclick=async()=>{const t=JSON.stringify(S);$("bText").value=t;toast(await copyText(t)?"コピーしました。メモ等に貼り付けて保管してください":"上の欄の文字を全選択してコピーしてください")};
$("bImp").onclick=()=>{try{const d=JSON.parse($("bText").value);if(!Array.isArray(d.items)||!Array.isArray(d.cats))throw 0;
  if(!confirm("今のデータを読み込んだ内容で置き換えます。よろしいですか?"))return;S=d;save();$("dBackup").close();render();toast("読み込みました")}catch(e){toast("読み込めませんでした。書き出した文字をそのまま貼り付けてください")}};
render();
</script>
</body>
</html>
